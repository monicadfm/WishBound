    <linearGradient id="ceu-vesper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- aura da raridade + céu de crepúsculo -->
