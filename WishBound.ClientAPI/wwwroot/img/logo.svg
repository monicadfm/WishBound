      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="55%" stop-color="#f3c04f"/>
      <stop offset="100%" stop-color="#d99a1f"/>
    </linearGradient>
    <linearGradient id="grad-texto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ff"/>
      <stop offset="100%" stop-color="#cfc4f2"/>
